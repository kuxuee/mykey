name: Build And Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: mykey-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  build-windows:
    name: Build Windows GPUI EXE
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust MSVC
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-msvc

      - name: Test password compatibility
        run: cargo test --no-default-features --locked

      - name: Build GPUI release
        run: cargo build --release --locked

      - name: Package Windows build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/mykey | Out-Null
          Copy-Item target/release/mykey.exe, LICENSE, THIRD_PARTY_NOTICES.md dist/mykey/
          Copy-Item licenses dist/mykey/ -Recurse
          Compress-Archive -Path dist/mykey/* -DestinationPath dist/mykey-windows-x64.zip

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: mykey-windows-x64
          path: dist/mykey-windows-x64.zip

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs:
      - build-android
      - build-windows

    steps:
      - name: Download Android artifact
        uses: actions/download-artifact@v4
        with:
          name: mykey-android-apk
          path: release-assets

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: mykey-windows-x64
          path: release-assets

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/app-release.apk
            release-assets/mykey-windows-x64.zip
          generate_release_notes: true
